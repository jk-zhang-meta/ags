[package]
name = "berth"
version = "2.1.0"
edition = "2024"
description = "Berth CLI (bh / berth) — Cage-isolated AI agent launcher and cross-agent session manager"
license-file = "LICENSE"
repository = "https://github.com/jk-zhang-meta/berth-cli"
keywords = ["cli", "agent", "berth", "session", "claude"]
categories = ["command-line-utilities"]
readme = "README.md"

# Private CLI companion for Berth (`berth`, with short alias `bh`).
[lib]
name = "berth"
path = "src/lib.rs"

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1.8.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
colored = "3"
dirs = "6"
glob = "0.3"
json5 = "1.3"
rusqlite = { version = "0.33", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
shlex = "1.3"
sha2 = "0.10"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tungstenite = "0.30"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
webpki-roots = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
which = "7"
rich_rust = "0.2.1"
rayon = "1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[build-dependencies]
vergen-gix = { version = "9", features = ["build", "cargo", "rustc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
