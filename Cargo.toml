[package]
name = "ags"
version = "0.8.1"
edition = "2024"
description = "Cross Agent Session Resumer — resume AI coding sessions across providers (CLI binary: ags)"
license-file = "LICENSE"
repository = "https://github.com/jk-zhang-meta/ags"
keywords = ["cli", "agent", "session", "resume", "claude"]
categories = ["command-line-utilities"]
readme = "README.md"

# 这是个私有 fork，不发到 crates.io。包名、lib 名和二进制名统一是 `ags`。
[lib]
name = "ags"
path = "src/lib.rs"

[[bin]]
name = "ags"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1.8.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
colored = "3"
dirs = "6"
glob = "0.3"
json5 = "1.3"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
shlex = "1.3"
sha2 = "0.10"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tungstenite = "0.30"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
which = "7"
rich_rust = "0.2.1"
rayon = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[build-dependencies]
vergen-gix = { version = "9", features = ["build", "cargo", "rustc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
